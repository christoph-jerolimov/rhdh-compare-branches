name: Deploy comparison to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Rebuild every hour, but only during the week of 2026-10-13 to 2026-10-18.
    # GitHub cron has no end date: the day/month fields limit it to these
    # dates and the "schedule-window" job below stops it from firing again in
    # later years. Remove or change both to run it permanently.
    - cron: '17 * 13-18 10 *'
  workflow_dispatch:
    inputs:
      base_branch:
        description: Base branch (left side of the diff)
        default: release-2.1
        required: true
      head_branch:
        description: Head branch (right side of the diff)
        default: main
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; do not cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Last day (UTC) on which scheduled runs are executed.
  SCHEDULE_UNTIL: '2026-10-18'

jobs:
  schedule-window:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Skip scheduled runs after the configured end date
        id: check
        run: |
          today=$(date -u +%F)
          if [[ "${{ github.event_name }}" == "schedule" && "$today" > "$SCHEDULE_UNTIL" ]]; then
            echo "Scheduled run on $today is after $SCHEDULE_UNTIL, skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: schedule-window
    if: needs.schedule-window.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Clone repositories and collect the differences
        env:
          BASE_BRANCH: ${{ inputs.base_branch || 'release-2.1' }}
          HEAD_BRANCH: ${{ inputs.head_branch || 'main' }}
          # Used to resolve commits without a PR number in their subject.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run collect

      - name: Build the site
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
