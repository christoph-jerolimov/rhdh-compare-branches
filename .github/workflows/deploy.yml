name: Deploy comparison to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Rebuild every day at 06:57 UTC. GitHub Actions cron is always UTC, so
    # this is 08:57 in Germany during summer time (CEST) and 07:57 during
    # winter time (CET).
    - cron: '57 6 * * *'
  workflow_dispatch:
    inputs:
      base_branch:
        description: Base branch (left side of the diff)
        default: release-2.1
        required: true
      head_branch:
        description: Head branch (right side of the diff)
        default: main
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; do not cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Clone repositories and collect the differences
        env:
          BASE_BRANCH: ${{ inputs.base_branch || 'release-2.1' }}
          HEAD_BRANCH: ${{ inputs.head_branch || 'main' }}
          # Used to resolve commits without a PR number in their subject.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run collect

      - name: Build the site
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
